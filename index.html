    <!-- Third-Party Embeds & ResizeObserver Error Suppressor -->
    <script>
      (function() {
        var isBenignThirdPartyError = function(err) {
          var msg = (err && (err.message || (typeof err === 'string' ? err : err.toString()))) || '';
          return (
            msg.indexOf('ResizeObserver') !== -1 ||
            msg.indexOf('Instagram') !== -1 ||
            msg.indexOf('Failed to fetch') !== -1 ||
            msg.indexOf('elfsight') !== -1 ||
            msg.indexOf('vimeo') !== -1
          );
        };

        window.addEventListener('error', function(e) {
          if (isBenignThirdPartyError(e)) {
            e.stopImmediatePropagation();
            e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isBenignThirdPartyError(e && e.reason)) {
            e.stopImmediatePropagation();
            e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isBenignThirdPartyError(message) || isBenignThirdPartyError(error)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
